services:
  - type: web
    name: kra-direct-stremio-nuvio
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node bootstrap.cjs
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.19.5
      - key: CONFIG_SECRET
        generateValue: true
      - key: DEBUG
        value: 0
      - key: TMDB_API_KEY
        sync: false
      - key: CSFD_ENRICH
        value: 1
